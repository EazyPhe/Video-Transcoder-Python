[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "video-transcoder-python"
version = "3.2.0"
description = "A feature-rich FFmpeg video transcoder with CLI and CustomTkinter interfaces."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ffmpeg", "transcoding", "video", "nvenc", "qsv", "amf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: 10",
    "Programming Language :: Python :: 3 :: 11",
    "Programming Language :: Python :: 3 :: 12",
    "Programming Language :: Python :: 3 :: 13",
    "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = [
    "psutil>=5.9",
    "rich>=13.0",
]

[project.optional-dependencies]
gui = [
    "customtkinter>=5.2",
    "Pillow>=10.0",
    "pystray>=0.19",
    "tkinterdnd2>=0.4.2",
]
portable = [
    "pyinstaller>=6.21,<7",
    "pyinstaller-hooks-contrib>=2026.6",
]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

[project.scripts]
video-transcoder = "transcode:main"

[project.gui-scripts]
video-transcoder-gui = "gui:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["app_state", "transcode", "gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
